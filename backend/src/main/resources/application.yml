server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: spectra-backend
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/spectra}
      database: spectra
  web:
    cors:
      allowed-origins: "http://localhost:3000"
  # File upload configuration for forensic evidence
  servlet:
    multipart:
      enabled: true
      max-file-size: 10GB        # Maximum size per file
      max-request-size: 50GB     # Maximum total request size
      file-size-threshold: 10MB  # Files larger than this are written to disk during upload
      location: ${java.io.tmpdir}  # Temporary storage during upload

spectra:
  jwt:
    secret: ${JWT_SECRET:spectra-super-secret-key-change-in-production-min-256-bits}
    expiration-ms: 86400000   # 24 hours
  flask:
    url: ${FLASK_URL:http://localhost:5001}
    api-key: ${FLASK_API_KEY:spectra-dev-key-change-in-prod}
  blockchain:
    rpc-url: ${BLOCKCHAIN_RPC:http://localhost:7545}
    contract-address: ${CONTRACT_ADDRESS:}
    private-key: ${BLOCKCHAIN_PRIVATE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.spectra: DEBUG
    org.springframework.security: INFO
